name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Unit testler yalnizca cevrimdisi modulleri kapsar; API'ye baglanmaz.
      - run: pip install numpy openai httpx certifi requests pytest
      - run: pytest -q
